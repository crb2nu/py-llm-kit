stages:
  - lint
  - test
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHON_VERSION: "3.12"
  # Safety: only publish to public PyPI when explicitly enabled.
  PUBLISH_PUBLIC_PYPI: "false"

.python-base:
  image: python:${PYTHON_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  extends: .python-base
  stage: lint
  script:
    - ruff check src/
    - ruff format --check src/
    - mypy src/ --ignore-missing-imports
  allow_failure: true

test:
  extends: .python-base
  stage: test
  script:
    - python -m pytest tests/ --cov=llm_kit --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

publish:
  extends: .python-base
  stage: publish
  script:
    - pip install build twine
    - python -m build --wheel
    - export TWINE_USERNAME=gitlab-ci-token
    - export TWINE_PASSWORD="${CI_JOB_TOKEN}"
    - twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*.whl
  rules:
    - if: $CI_COMMIT_TAG
  when: manual

publish:pypi:
  extends: .python-base
  stage: publish
  script:
    - pip install build twine
    - python -m build --wheel
    - export TWINE_USERNAME=__token__
    - export TWINE_PASSWORD="${PYPI_API_TOKEN}"
    - twine upload --repository-url https://upload.pypi.org/legacy/ dist/*.whl
  rules:
    - if: '$CI_COMMIT_TAG && $PUBLISH_PUBLIC_PYPI == "true"'
  when: manual
