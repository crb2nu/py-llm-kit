# Python CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

stages: [lint, test, publish]

variables:
  PUBLISH_PUBLIC_PYPI: "false"

lint:
  extends: .python-lint

test:
  extends: .python-test

publish:
  extends: .python-publish-gitlab

publish:pypi:
  extends: .python-publish-pypi
