# Python CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages: [lint, test, publish]

variables:
  PUBLISH_PUBLIC_PYPI: "false"

.python-base:
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PIP_INDEX_URL: "https://pypi.org/simple"
    PIP_EXTRA_INDEX_URL: ""
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -e ".[dev]"

lint:
  extends: .python-lint

test:
  extends: .python-test

publish:
  extends: .python-publish-gitlab

publish:pypi:
  extends: .python-publish-pypi

radar-scan:
  extends: .radar-scan
